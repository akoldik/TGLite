plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.tglite.app'
    compileSdk 35

    defaultConfig {
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
        applicationId 'com.tglite.app'
        minSdk 24
        targetSdk 28
        versionCode 3
        versionName '1.0.0-preBETA:3'
        python {
            version '3.11'
            pip {
                install 'telethon==1.42.0'
            }
        }
    }
}
